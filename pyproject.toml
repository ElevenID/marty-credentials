[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "marty-credentials-test-harness"
dynamic = ["version"]
description = "Internal contract test harness for Marty Rust credentials"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Adam Burdett" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
keywords = ["credentials", "verifiable-credentials", "mdl", "identity", "cryptography"]

# Native binding dependencies belong to the released wheels, not this
# metadata-only harness. Tests declare their own tooling dependencies.
dependencies = []

[project.optional-dependencies]
# The root project is a test harness. Core owns the canonical native wheel.
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "PyYAML>=6.0",
    "mypy>=1.8",
    "ruff>=0.2",
]

[project.urls]
Homepage = "https://github.com/ElevenID/marty-credentials"
Documentation = "https://github.com/ElevenID/marty-credentials#readme"
Repository = "https://github.com/ElevenID/marty-credentials.git"
Issues = "https://github.com/ElevenID/marty-credentials/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Tooling metadata only. No Python runtime package is distributed.
only-include = []
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
