[workspace]
resolver = "2"
members = ["rust/marty-rs"]

[workspace.package]
version = "0.1.79"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/ElevenID/marty-credentials"

[workspace.dependencies]
marty-python-adapters = { git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249" }
# Core crates from marty-core
marty-crypto = { git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249", default-features = false, features = ["kms-only", "bbs-verification"] }
# Browser builds use the verification core; native bindings enable the LDAP-backed ICAO client.
marty-verification = { git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249", default-features = false, features = ["kms-only", "iaca", "csca"] }
marty-status = { git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249" }

# PEM encoding
pem-rfc7468 = { version = "1.0", features = ["alloc"] }
marty-oid4vci = { git = "https://github.com/ElevenID/marty-core", rev = "7fd9106032ab455ed9eb1708a584014a52af7249", default-features = false, features = ["kms-only", "issuer", "verifier", "jwt_vc_json", "sd_jwt", "mso_mdoc"] }

# PyO3 for Python bindings
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py311"] }

# SSI ecosystem
ssi-status = { version = "0.8.1", default-features = false }
isomdl = { version = "0.4", default-features = false }
coset = { version = "0.4" }
time = { version = "0.3", features = ["formatting", "parsing"] }

# SD-JWT
sd-jwt-rs = { git = "https://github.com/ElevenID/sd-jwt-rust", rev = "fbe1e1b2c4bf0d62b0fdf0f47f265ffdaaae1ff2", default-features = false, features = ["verifier"] }

# JWT
jsonwebtoken = { version = "10.4", default-features = false, features = ["use_pem"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
ciborium = { version = "0.2" }

# Crypto
base64 = { version = "0.23" }
rand = { version = "0.10" }

# Async
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "sync", "macros"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = { version = "2.0" }

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-error = { version = "0.2" }

[profile.release]
lto = true
codegen-units = 1
strip = true

