[workspace]
resolver = "2"
members = ["rust/marty-rs"]

[workspace.package]
version = "0.1.79"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/ElevenID/marty-credentials"

[workspace.dependencies]
marty-python-adapters = { git = "https://github.com/ElevenID/marty-core", rev = "d41d87cc2ef8eeaddbb9d659c2ac5642f7a0ce82" }
# Core crates from marty-core
marty-crypto = { git = "https://github.com/ElevenID/marty-core", rev = "d41d87cc2ef8eeaddbb9d659c2ac5642f7a0ce82", default-features = false, features = ["kms-only", "bbs-verification"] }
marty-verification = { git = "https://github.com/ElevenID/marty-core", rev = "d41d87cc2ef8eeaddbb9d659c2ac5642f7a0ce82", default-features = false, features = ["kms-only", "iaca", "csca", "icao-client"] }
marty-status = { git = "https://github.com/ElevenID/marty-core", rev = "d41d87cc2ef8eeaddbb9d659c2ac5642f7a0ce82" }

# PEM encoding
pem-rfc7468 = { version = "1.0", features = ["alloc"] }
marty-oid4vci = { git = "https://github.com/ElevenID/marty-core", rev = "d41d87cc2ef8eeaddbb9d659c2ac5642f7a0ce82", default-features = false, features = ["kms-only", "issuer", "verifier", "jwt_vc_json", "sd_jwt", "mso_mdoc"] }

# PyO3 for Python bindings
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py311"] }

# SSI ecosystem
ssi-crypto = { version = "0.2.1", default-features = false, features = ["secp256k1", "ed25519", "secp256r1", "secp384r1"] }
ssi-jwk = { version = "0.4.0", default-features = false, features = ["secp256k1", "ed25519", "secp256r1", "secp384r1"] }
ssi-status = { version = "0.8.1", default-features = false }
isomdl = { version = "0.3", default-features = false }
coset = { version = "0.4" }
time = { version = "0.3", features = ["formatting", "parsing"] }

# SD-JWT
sd-jwt-rs = { git = "https://github.com/ElevenID/sd-jwt-rust", rev = "302984b4431c331408c58c62f23a07339394c986" }

# JWT
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
ciborium = { version = "0.2" }

# Crypto
bs58 = { version = "0.5" }
base64 = { version = "0.23" }
rsa = { version = "0.9" }
rand = { version = "0.10" }

# Async
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "sync", "macros"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = { version = "2.0" }

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-error = { version = "0.2" }

[profile.release]
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
# Reviewed SSI security fork. Its linked-data crate removes the unsound and
# unmaintained im/sized-chunks container chain from production graphs.
linked-data = { git = "https://github.com/ElevenID/ssi-elevenid", rev = "6f86efc1579033e14ff2ad7d115ca0857e16a67f" }
# Temporary security fork pending https://github.com/spruceid/ssi/pull/706.
ssi-jwt = { git = "https://github.com/ElevenID/ssi-jwt-elevenid", rev = "957c8b0fbf3e4b967fe73c858a22b38e907b3023" }
# Maintained ElevenID security/interoperability fork. The exact revision is
# reviewed and synchronized from upstream through pull requests.
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "784a52943469622873c7ae3200dbc11e89d6bd8e" }
