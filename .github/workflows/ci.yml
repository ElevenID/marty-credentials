name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MARTY_CORE_REVISION: bd6e4cc9a7e86d11aec53194899e074289f7b681

jobs:
  preflight:
    name: Fast Rust Preflight
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'merge_group' || github.actor == 'dependabot[bot]') && 'READ_ONLY' || 'READ_WRITE' }}
    defaults:
      run:
        working-directory: marty-credentials/rust/marty-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Enable compiler cache
        uses: ./marty-credentials/.github/actions/optional-sccache
        with:
          version: v0.16.0
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-rust-stable-inputs-${{ hashFiles('marty-credentials/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the native feature set
        run: cargo check --locked --no-default-features --features native
      - name: Require KMS-only Core dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-default-features --features python |
            python3 ../../scripts/ci/check_core_kms_graph.py
      - name: Require scalar credential digest feature selection
        shell: bash
        run: |
          set -euo pipefail
          check_scalar_surface() {
            local feature_set="$1"
            shift
            local feature_tree
            local target_label="${*:-host}"
            feature_tree="$(cargo tree --locked --no-default-features --features "$feature_set" --edges normal,build,features "$@")"
            if grep -F 'isomdl feature "issuer-local-signing"' <<<"$feature_tree"; then
              echo "the $feature_set KMS-only surface must exclude mdoc local signing ($target_label)" >&2
              exit 1
            fi
            if grep -E 'isomdl feature "(parallel|simd)"' <<<"$feature_tree"; then
              echo "isomdl parallel and SIMD acceleration must remain inactive for the $feature_set consumer surface ($target_label)" >&2
              exit 1
            fi
            if grep -E 'sd-jwt-rs feature "(issuance_bench|mock_salts|parallel)"' <<<"$feature_tree"; then
              echo "sd-jwt-rs parallel, benchmark, and mock-salt features must remain inactive for the $feature_set consumer surface ($target_label)" >&2
              exit 1
            fi
          }
          check_scalar_surface native
          check_scalar_surface python
          check_scalar_surface wasm --target wasm32-unknown-unknown
          check_scalar_surface wasm-full --target wasm32-unknown-unknown

  test-rust:
    name: Rust ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'merge_group' || github.actor == 'dependabot[bot]') && 'READ_ONLY' || 'READ_WRITE' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        task: [tests, clippy]
    defaults:
      run:
        working-directory: marty-credentials/rust/marty-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Enable compiler cache
        uses: ./marty-credentials/.github/actions/optional-sccache
        with:
          version: v0.16.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-rust-stable-inputs-${{ hashFiles('marty-credentials/Cargo.lock') }}

      - name: Compile native bindings and run unit tests
        if: matrix.task == 'tests'
        # Python and WASM bindings are exercised in their dedicated jobs. PyO3's
        # extension-module mode intentionally does not link libpython, so it
        # cannot be linked into a native Rust test harness.
        run: cargo test --locked --lib --no-default-features --features native

      - name: Retain Rust documentation tests
        if: matrix.task == 'tests'
        run: cargo test --locked --doc --no-default-features --features native

      - name: Run clippy
        if: matrix.task == 'clippy'
        # Python and WASM features target different link environments and must
        # not be combined in one all-features build.
        run: cargo clippy --locked --no-default-features --features native -- -D warnings

  test-local-python-binding:
    name: Local Marty Python Binding
    needs: build-core-python-wheels
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'merge_group' || github.actor == 'dependabot[bot]') && 'READ_ONLY' || 'READ_WRITE' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Download KMS-only verification wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: core-python-Linux
          path: compatibility-wheels

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          # Match rust-toolchain.toml before maturin enters the workspace;
          # a later rustup component install can conflict with cargo-fmt.
          components: clippy, rustfmt

      - name: Enable compiler cache
        uses: ./marty-credentials/.github/actions/optional-sccache
        with:
          version: v0.16.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-rust-stable-inputs-${{ hashFiles('marty-credentials/Cargo.lock') }}

      - name: Build the local Python extension from the locked workspace
        working-directory: marty-credentials
        run: |
          # This isolated binding job does not install the project package.
          python -m pip install --disable-pip-version-check maturin==1.14.1 pytest pytest-asyncio
          python -m pip install --disable-pip-version-check ../compatibility-wheels/marty_verification_py-*.whl
          maturin build --locked --manifest-path rust/marty-rs/Cargo.toml --no-default-features --features python --out local-wheels
          scripts/retry-command.sh python -m pip install --disable-pip-version-check local-wheels/*.whl

      - name: Exercise the local Python crypto boundaries
        working-directory: marty-credentials
        run: pytest rust/marty-rs/tests/python -v

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit --locked
          fi

      - name: Run cargo-audit
        working-directory: marty-credentials
        # RSA compatibility is retained behind Marty crypto adapters and has
        # no patched upstream release. Keep this one documented exception
        # explicit; every other vulnerability remains release-blocking.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install cargo-deny --locked
          fi

      - name: Run cargo-deny
        working-directory: marty-credentials
        run: cargo deny check

  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit

      - name: Run bandit
        working-directory: marty-credentials
        run: bandit -r scripts/ packages/marty_proto/ -ll -ii

      - name: Audit resolvable Python dependencies
        working-directory: marty-credentials
        shell: bash
        run: |
          set -euo pipefail
          scripts/retry-command.sh pip-audit . --format json --output pip-audit.json
          python - <<'PY'
          import json

          report = json.load(open("pip-audit.json", encoding="utf-8"))
          skipped = {
              dependency["name"]
              for dependency in report["dependencies"]
              if dependency.get("skip_reason")
          }
          expected_github_release_dependencies = {"marty-common"}
          if skipped != expected_github_release_dependencies:
              raise SystemExit(f"Unexpected unaudited Python dependencies: {sorted(skipped)}")
          PY

  build-core-python-wheels:
    name: Core Python Wheels
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'merge_group' || github.actor == 'dependabot[bot]') && 'READ_ONLY' || 'READ_WRITE' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - name: Restore exact pinned Core wheels
        id: core-wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core-wheels
          key: core-python-wheels-v5-${{ runner.os }}-${{ runner.arch }}-py311-rust1971-maturin1141-${{ env.MARTY_CORE_REVISION }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials
          persist-credentials: false

      - if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ElevenID/marty-core
          ref: ${{ env.MARTY_CORE_REVISION }}
          path: marty-core
          persist-credentials: false

      - if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1

      - name: Enable compiler cache
        if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: ./marty-credentials/.github/actions/optional-sccache
        with:
          version: v0.16.0

      - name: Cache Core build
        if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-core-python-inputs-v5-${{ env.MARTY_CORE_REVISION }}

      - name: Build exact pinned Core wheels
        if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.14.1
          maturin build --release --compatibility off --manifest-path marty-core/marty-bindings/Cargo.toml --no-default-features --features extension-module,kms-only,ephemeral-session-keys --out core-wheels
          maturin build --release --compatibility off --manifest-path marty-core/marty-verification/Cargo.toml --no-default-features --features pyo3/extension-module,python,kms-only,iaca,csca,eudi --out core-wheels

      - name: Validate built Core module exports
        run: |
          python -c "import pathlib, subprocess, sys; wheels = sorted(map(str, pathlib.Path('core-wheels').glob('*.whl'))); assert len(wheels) == 2, wheels; subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', *wheels], check=True)"
          python -c "import marty_rs, marty_verification; assert callable(marty_rs.oid4vci_prepare_mdoc); assert callable(marty_rs.oid4vci_prepare_sd_jwt); assert callable(marty_rs.oid4vci_prepare_jwt_vc); assert callable(marty_rs.oid4vci_prepare_open_badge_v3_jwt_vc); assert not hasattr(marty_rs, 'didcomm_decrypt'); assert not hasattr(marty_rs, 'didcomm_encrypt_authcrypt'); assert callable(marty_verification.p256_public_jwk_to_pem); assert callable(marty_verification.open_badge_ob3_verify); assert not any(hasattr(marty_verification, name) for name in ('aes_gcm_encrypt', 'aes_gcm_decrypt', 'generate_random_bytes', 'open_badge_ob2_issue', 'open_badge_ob3_issue'))"

      - name: Require both native distributions
        shell: bash
        run: |
          set -euo pipefail
          test "$(find core-wheels -maxdepth 1 -name 'marty_rs-*.whl' | wc -l)" -eq 1
          test "$(find core-wheels -maxdepth 1 -name 'marty_verification_py-*.whl' | wc -l)" -eq 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-python-${{ runner.os }}
          path: core-wheels/*.whl
          if-no-files-found: error
          retention-days: 2

  test-python:
    name: Python Tests
    needs: build-core-python-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: core-python-${{ runner.os }}
          path: marty-credentials/release-deps

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: marty-credentials/pyproject.toml
      - name: Run Python 3.11 quality suite
        working-directory: marty-credentials
        shell: bash
        run: bash scripts/run-python-ci.sh
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: marty-credentials/pyproject.toml
      - name: Run Python 3.12 quality suite
        working-directory: marty-credentials
        shell: bash
        run: bash scripts/run-python-ci.sh

  test-wasm:
    name: WASM Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marty-credentials/rust/marty-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM (web target)
        run: wasm-pack build --locked --target web --no-default-features --features wasm

      - name: Build WASM (nodejs target)
        run: wasm-pack build --locked --target nodejs --no-default-features --features wasm

      - name: Build WASM (bundler target)
        run: wasm-pack build --locked --target bundler --no-default-features --features wasm

      - name: Test WASM
        run: wasm-pack test --node --no-default-features --features wasm

  issuance-retirement-qualification:
    name: Python Retirement Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Keep retired Python source and publication paths absent
        working-directory: marty-credentials
        shell: bash
        run: |
          set -euo pipefail
          # The #311 receipt is immutable provenance; its source SHA predates
          # the squash merge and cannot be an ancestry gate for later PRs.
          test ! -d services/issuance
          test ! -e services/Dockerfile
          test ! -d python/marty_credentials
          test ! -e .github/workflows/release-images.yml
          test ! -e .github/workflows/release-stable.yml
          test ! -e .github/workflows/publish-pypi.yml
          python -c 'import json; from pathlib import Path; assert json.loads(Path("contracts/python-sdk-retirement-v1.json").read_text())["schema"] == "marty.python-sdk-retirement/v1"'

  ci-gate:
    name: CI Gate
    if: always()
    needs: [preflight, test-rust, test-local-python-binding, security, python-security, build-core-python-wheels, test-python, test-wasm, issuance-retirement-qualification]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Require every CI lane
        shell: bash
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
      - name: Summarize CI performance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: context.runId});
            const {data} = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId, filter: 'latest', per_page: 100,
            });
            const created = new Date(run.created_at);
            const rows = data.jobs.filter(job => job.started_at && job.completed_at).map(job => ({
              name: job.name,
              queue: Math.max(0, Math.round((new Date(job.started_at) - created) / 1000)),
              run: Math.max(0, Math.round((new Date(job.completed_at) - new Date(job.started_at)) / 1000)),
            })).sort((a, b) => b.run - a.run);
            const maxQueue = Math.max(0, ...rows.map(row => row.queue));
            core.summary.addHeading('CI performance').addTable([
              [{data: 'Longest jobs', header: true}, {data: 'Queue', header: true}, {data: 'Runtime', header: true}],
              ...rows.slice(0, 10).map(row => [row.name, `${row.queue}s`, `${row.run}s`]),
            ]).addRaw(`Longest observed queue delay: ${maxQueue}s.`);
            if (maxQueue > 300) core.warning(`Runner queue delay reached ${maxQueue}s.`);
            await core.summary.write();
