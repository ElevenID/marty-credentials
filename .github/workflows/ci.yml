name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MARTY_CORE_REVISION: 2996a196d05a70a84c842f62a6b79c33284e69e3

jobs:
  preflight:
    name: Fast Rust Preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marty-credentials/rust/marty-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            marty-credentials/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-stable-cargo-${{ hashFiles('marty-credentials/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the native feature set
        run: cargo check --locked --no-default-features --features native

  test-rust:
    name: Rust Tests
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: marty-credentials/rust/marty-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            marty-credentials/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-stable-cargo-${{ hashFiles('marty-credentials/Cargo.lock') }}

      - name: Run tests
        # Python and WASM bindings are exercised in their dedicated jobs. PyO3's
        # extension-module mode intentionally does not link libpython, so it
        # cannot be linked into a native Rust test harness.
        run: cargo test --locked --no-default-features --features native

      - name: Run clippy
        # Python and WASM features target different link environments and must
        # not be combined in one all-features build.
        run: cargo clippy --locked --no-default-features --features native -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  security:
    name: Security Audit
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit --locked
          fi

      - name: Run cargo-audit
        working-directory: marty-credentials
        # RSA compatibility is retained behind Marty crypto adapters and has
        # no patched upstream release. Keep this one documented exception
        # explicit; every other vulnerability remains release-blocking.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install cargo-deny --locked
          fi

      - name: Run cargo-deny
        working-directory: marty-credentials
        run: cargo deny check

  python-security:
    name: Python Security
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit

      - name: Run bandit
        working-directory: marty-credentials
        run: bandit -r python/marty_credentials/ -ll -ii

      - name: Audit resolvable Python dependencies
        working-directory: marty-credentials
        shell: bash
        run: |
          set -euo pipefail
          pip-audit . --format json --output pip-audit.json
          python - <<'PY'
          import json

          report = json.load(open("pip-audit.json", encoding="utf-8"))
          skipped = {
              dependency["name"]
              for dependency in report["dependencies"]
              if dependency.get("skip_reason")
          }
          expected_github_release_dependencies = {"marty-common", "marty-msf"}
          if skipped != expected_github_release_dependencies:
              raise SystemExit(f"Unexpected unaudited Python dependencies: {sorted(skipped)}")
          PY

  canvas-portable-migration:
    name: Canvas PostgreSQL Migration Contract
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CANVAS_MIGRATION_SOURCE_REVISION: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: canvas-portable-migration-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: marty-credentials

      - name: Validate disposable migration topology
        working-directory: marty-credentials
        run: docker compose --file docker-compose.canvas-migration-contract.yml config --quiet

      - name: Build migration contract image
        working-directory: marty-credentials
        run: |
          mkdir -p tests/artifacts/canvas-portable-migration
          chmod 0777 tests/artifacts/canvas-portable-migration
          docker compose --file docker-compose.canvas-migration-contract.yml build --pull migration-contract

      - name: Exercise upgrade and exact downgrade restoration
        working-directory: marty-credentials
        run: >-
          docker compose --file docker-compose.canvas-migration-contract.yml
          up --force-recreate --abort-on-container-exit
          --exit-code-from migration-contract migration-contract

      - name: Require successful sanitized contract evidence
        working-directory: marty-credentials
        run: |
          test "$(jq -r '.status' tests/artifacts/canvas-portable-migration/contract-result.json)" = passed
          test "$(jq -r '.baseline_revision' tests/artifacts/canvas-portable-migration/contract-result.json)" = derive_server_owned_claims
          test "$(jq -r '.portable_revision' tests/artifacts/canvas-portable-migration/contract-result.json)" = portable_canvas_connections
          test "$(jq -r '.execution_boundary' tests/artifacts/canvas-portable-migration/contract-result.json)" = docker_compose_one_shot
          test "$(jq -r '.source_revision' tests/artifacts/canvas-portable-migration/contract-result.json)" = "$GITHUB_SHA"

      - name: Upload Canvas migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: canvas-portable-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: marty-credentials/tests/artifacts/canvas-portable-migration/contract-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable migration stack
        if: always()
        working-directory: marty-credentials
        run: docker compose --file docker-compose.canvas-migration-contract.yml down --volumes --remove-orphans

  issuance-idempotency-contract:
    name: Issuance Idempotency PostgreSQL Contract
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ISSUANCE_IDEMPOTENCY_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPOSE_PROJECT_NAME: issuance-idempotency-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: marty-credentials
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate disposable idempotency topology
        working-directory: marty-credentials
        run: docker compose --file docker-compose.issuance-idempotency-contract.yml config --quiet

      - name: Build idempotency contract image
        working-directory: marty-credentials
        run: |
          mkdir -p tests/artifacts/issuance-idempotency
          chmod 0777 tests/artifacts/issuance-idempotency
          docker compose --file docker-compose.issuance-idempotency-contract.yml build --pull idempotency-contract

      - name: Race identical issuance reservations in PostgreSQL
        working-directory: marty-credentials
        run: >-
          docker compose --file docker-compose.issuance-idempotency-contract.yml
          up --force-recreate --abort-on-container-exit
          --exit-code-from idempotency-contract idempotency-contract

      - name: Require sanitized idempotency evidence
        working-directory: marty-credentials
        run: |
          test "$(jq -r '.status' tests/artifacts/issuance-idempotency/contract-result.json)" = passed
          test "$(jq -r '.migration_revision' tests/artifacts/issuance-idempotency/contract-result.json)" = merge_issuance_heads
          test "$(jq -r '.created_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.recovered_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.same_transaction' tests/artifacts/issuance-idempotency/contract-result.json)" = true
          test "$(jq -r '.same_pre_authorized_code' tests/artifacts/issuance-idempotency/contract-result.json)" = true
          test "$(jq -r '.raw_key_persisted' tests/artifacts/issuance-idempotency/contract-result.json)" = false
          test "$(jq -r '.production_repository_exercised' tests/artifacts/issuance-idempotency/contract-result.json)" = true
          test "$(jq -r '.changed_semantics_rejected' tests/artifacts/issuance-idempotency/contract-result.json)" = true
          test "$(jq -r '.early_recovery_exercised' tests/artifacts/issuance-idempotency/contract-result.json)" = true
          test "$(jq -r '.source_revision' tests/artifacts/issuance-idempotency/contract-result.json)" = "$ISSUANCE_IDEMPOTENCY_SOURCE_REVISION"

      - name: Upload issuance idempotency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: issuance-idempotency-${{ github.run_id }}-${{ github.run_attempt }}
          path: marty-credentials/tests/artifacts/issuance-idempotency/contract-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable idempotency stack
        if: always()
        working-directory: marty-credentials
        run: docker compose --file docker-compose.issuance-idempotency-contract.yml down --volumes --remove-orphans

  build-core-python-wheels:
    name: Core Python Wheels
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Restore exact pinned Core wheels
        id: core-wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core-wheels
          key: core-python-wheels-v1-${{ runner.os }}-${{ runner.arch }}-py311-rust1971-maturin1141-${{ env.MARTY_CORE_REVISION }}

      - if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ElevenID/marty-core
          ref: ${{ env.MARTY_CORE_REVISION }}
          path: marty-core

      - if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1

      - name: Cache Core build
        if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            marty-core/target
          key: ${{ runner.os }}-core-python-${{ env.MARTY_CORE_REVISION }}

      - name: Build exact pinned Core wheels
        if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.14.1
          maturin build --release --compatibility off --manifest-path marty-core/marty-bindings/Cargo.toml --out core-wheels
          maturin build --release --compatibility off --manifest-path marty-core/marty-verification/Cargo.toml --out core-wheels

      - name: Require both native distributions
        shell: bash
        run: |
          set -euo pipefail
          test "$(find core-wheels -maxdepth 1 -name 'marty_rs-*.whl' | wc -l)" -eq 1
          test "$(find core-wheels -maxdepth 1 -name 'marty_verification_py-*.whl' | wc -l)" -eq 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-python-${{ runner.os }}
          path: core-wheels/*.whl
          if-no-files-found: error
          retention-days: 2

  test-python:
    name: Python Tests
    needs: build-core-python-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: core-python-${{ runner.os }}
          path: marty-credentials/release-deps

      - name: Install dependencies
        working-directory: marty-credentials
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio
          python -c "import pathlib, subprocess, sys; wheels = sorted(map(str, pathlib.Path('release-deps').glob('*.whl'))); assert len(wheels) == 2, wheels; subprocess.run([sys.executable, '-m', 'pip', 'install', *wheels], check=True)"

      - name: Install Python package
        working-directory: marty-credentials
        run: pip install -e .[dev]

      - name: Enforce native verification backend contract
        working-directory: marty-credentials
        env:
          PYTHONPATH: ${{ github.workspace }}/marty-credentials/services
        run: >-
          python -c "from issuance.application.rust_integration import
          validate_marty_rs_capabilities as validate_issuance;
          from verification.application.rust_verifier import
          validate_marty_rs_capabilities as validate_verification;
          validate_issuance(); validate_verification()"

      - name: Verify issuance migration graph has one head
        working-directory: marty-credentials/services/issuance/infrastructure/migrations
        run: python -m alembic -c alembic.ini heads

      - name: Verify verification migration graph has one head
        working-directory: marty-credentials/services/verification/infrastructure/migrations
        run: python -m alembic -c alembic.ini heads

      - name: Run Python tests
        working-directory: marty-credentials
        run: pytest tests/ packages/tests/ -v

  oid4vci-capability-postgres:
    name: OID4VCI Capability PostgreSQL Race
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OID4VCI_CAPABILITY_TEST_DATABASE_URL: postgresql+asyncpg://marty:marty_test@localhost:5432/marty_oid4vci_test
    services:
      postgres:
        image: postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: marty
          POSTGRES_PASSWORD: marty_test
          POSTGRES_DB: marty_oid4vci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marty -d marty_oid4vci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: marty-credentials

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install service test dependencies
        working-directory: marty-credentials
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] "psycopg[binary]==3.2.3"

      - name: Exercise shared atomic PAR and proof-nonce consumption
        working-directory: marty-credentials
        run: pytest tests/test_oid4vci_ephemeral_capabilities_postgres.py -v

  verification-session-postgres:
    name: Verification Session PostgreSQL Race
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFICATION_SESSION_TEST_DATABASE_URL: postgresql+asyncpg://marty:marty_test@localhost:5432/marty_verification_test
    services:
      postgres:
        image: postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: marty
          POSTGRES_PASSWORD: marty_test
          POSTGRES_DB: marty_verification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marty -d marty_verification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: marty-credentials

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install service test dependencies
        working-directory: marty-credentials
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Exercise atomic claim, recovery, and terminal fencing
        working-directory: marty-credentials
        run: >-
          pytest tests/test_verification_evidence_lifecycle.py
          -k real_postgres_claim_recovery_and_terminal_fencing -v

  test-wasm:
    name: WASM Tests
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marty-credentials/rust/marty-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM (web target)
        run: wasm-pack build --locked --target web --no-default-features --features wasm

      - name: Build WASM (nodejs target)
        run: wasm-pack build --locked --target nodejs --no-default-features --features wasm

      - name: Build WASM (bundler target)
        run: wasm-pack build --locked --target bundler --no-default-features --features wasm

      - name: Test WASM
        run: wasm-pack test --node --no-default-features --features wasm
