name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MARTY_CORE_REVISION: 168e13b424ad26b300fb2c7ba58e14643c6d881a

jobs:
  preflight:
    name: Fast Rust Preflight
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'merge_group' || github.actor == 'dependabot[bot]') && 'READ_ONLY' || 'READ_WRITE' }}
    defaults:
      run:
        working-directory: marty-credentials/rust/marty-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-rust-stable-inputs-${{ hashFiles('marty-credentials/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the native feature set
        run: cargo check --locked --no-default-features --features native
      - name: Require scalar credential digest feature selection
        shell: bash
        run: |
          set -euo pipefail
          check_scalar_surface() {
            local feature_set="$1"
            shift
            local feature_tree
            local target_label="${*:-host}"
            feature_tree="$(cargo tree --locked --no-default-features --features "$feature_set" --edges normal,build,features "$@")"
            grep -F 'isomdl feature "default"' <<<"$feature_tree"
            if grep -E 'isomdl feature "(parallel|simd)"' <<<"$feature_tree"; then
              echo "isomdl parallel and SIMD acceleration must remain inactive for the $feature_set consumer surface ($target_label)" >&2
              exit 1
            fi
            if grep -E 'sd-jwt-rs feature "(issuance_bench|mock_salts|parallel)"' <<<"$feature_tree"; then
              echo "sd-jwt-rs parallel, benchmark, and mock-salt features must remain inactive for the $feature_set consumer surface ($target_label)" >&2
              exit 1
            fi
          }
          check_scalar_surface native
          check_scalar_surface python
          check_scalar_surface wasm --target wasm32-unknown-unknown
          check_scalar_surface wasm-full --target wasm32-unknown-unknown

  test-rust:
    name: Rust ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'merge_group' || github.actor == 'dependabot[bot]') && 'READ_ONLY' || 'READ_WRITE' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        task: [tests, clippy]
    defaults:
      run:
        working-directory: marty-credentials/rust/marty-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install cargo-nextest
        if: matrix.task == 'tests'
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: cargo-nextest@0.9.143

      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-rust-stable-inputs-${{ hashFiles('marty-credentials/Cargo.lock') }}

      - name: Run tests
        if: matrix.task == 'tests'
        # Python and WASM bindings are exercised in their dedicated jobs. PyO3's
        # extension-module mode intentionally does not link libpython, so it
        # cannot be linked into a native Rust test harness.
        run: cargo nextest run --locked --no-default-features --features native

      - name: Retain Rust documentation tests
        if: matrix.task == 'tests'
        run: cargo test --locked --doc --no-default-features --features native

      - name: Run clippy
        if: matrix.task == 'clippy'
        # Python and WASM features target different link environments and must
        # not be combined in one all-features build.
        run: cargo clippy --locked --no-default-features --features native -- -D warnings

  test-local-python-binding:
    name: Local Marty Python Binding
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'merge_group' || github.actor == 'dependabot[bot]') && 'READ_ONLY' || 'READ_WRITE' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-rust-stable-inputs-${{ hashFiles('marty-credentials/Cargo.lock') }}

      - name: Build the local Python extension from the locked workspace
        working-directory: marty-credentials
        run: |
          python -m pip install --disable-pip-version-check maturin==1.14.1 pytest pytest-asyncio
          maturin build --locked --manifest-path rust/marty-rs/Cargo.toml --no-default-features --features python --out local-wheels
          python -m pip install --disable-pip-version-check local-wheels/*.whl

      - name: Exercise the local Python crypto boundaries
        working-directory: marty-credentials
        run: pytest rust/marty-rs/tests/python -v

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit --locked
          fi

      - name: Run cargo-audit
        working-directory: marty-credentials
        # RSA compatibility is retained behind Marty crypto adapters and has
        # no patched upstream release. Keep this one documented exception
        # explicit; every other vulnerability remains release-blocking.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install cargo-deny --locked
          fi

      - name: Run cargo-deny
        working-directory: marty-credentials
        run: cargo deny check

  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit

      - name: Run bandit
        working-directory: marty-credentials
        run: bandit -r python/marty_credentials/ -ll -ii

      - name: Audit resolvable Python dependencies
        working-directory: marty-credentials
        shell: bash
        run: |
          set -euo pipefail
          pip-audit . --format json --output pip-audit.json
          python - <<'PY'
          import json

          report = json.load(open("pip-audit.json", encoding="utf-8"))
          skipped = {
              dependency["name"]
              for dependency in report["dependencies"]
              if dependency.get("skip_reason")
          }
          expected_github_release_dependencies = {"marty-common"}
          if skipped != expected_github_release_dependencies:
              raise SystemExit(f"Unexpected unaudited Python dependencies: {sorted(skipped)}")
          PY

  canvas-portable-migration:
    name: Canvas PostgreSQL Migration Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CANVAS_MIGRATION_SOURCE_REVISION: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: canvas-portable-migration-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: marty-credentials

      - name: Validate disposable migration topology
        working-directory: marty-credentials
        run: docker compose --file docker-compose.canvas-migration-contract.yml config --quiet

      - name: Build migration contract image
        working-directory: marty-credentials
        run: |
          mkdir -p tests/artifacts/canvas-portable-migration
          chmod 0777 tests/artifacts/canvas-portable-migration
          docker compose --file docker-compose.canvas-migration-contract.yml build --pull migration-contract

      - name: Exercise upgrade and exact downgrade restoration
        working-directory: marty-credentials
        run: >-
          docker compose --file docker-compose.canvas-migration-contract.yml
          up --force-recreate --abort-on-container-exit
          --exit-code-from migration-contract migration-contract

      - name: Require successful sanitized contract evidence
        working-directory: marty-credentials
        run: |
          test "$(jq -r '.status' tests/artifacts/canvas-portable-migration/contract-result.json)" = passed
          test "$(jq -r '.baseline_revision' tests/artifacts/canvas-portable-migration/contract-result.json)" = derive_server_owned_claims
          test "$(jq -r '.portable_revision' tests/artifacts/canvas-portable-migration/contract-result.json)" = portable_canvas_connections
          test "$(jq -r '.execution_boundary' tests/artifacts/canvas-portable-migration/contract-result.json)" = docker_compose_one_shot
          test "$(jq -r '.source_revision' tests/artifacts/canvas-portable-migration/contract-result.json)" = "$GITHUB_SHA"

      - name: Upload Canvas migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: canvas-portable-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: marty-credentials/tests/artifacts/canvas-portable-migration/contract-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable migration stack
        if: always()
        working-directory: marty-credentials
        run: docker compose --file docker-compose.canvas-migration-contract.yml down --volumes --remove-orphans

  canvas-worker-consumer-ranges:
    name: Canvas Worker PostgreSQL Consumer Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Replay every frozen consumer range against published and checkout sources
        run: python scripts/run_canvas_worker_consumer_oracle.py --source both

  issuance-idempotency-contract:
    name: Issuance Idempotency PostgreSQL Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ISSUANCE_IDEMPOTENCY_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPOSE_PROJECT_NAME: issuance-idempotency-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: marty-credentials
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate disposable idempotency topology
        working-directory: marty-credentials
        run: docker compose --file docker-compose.issuance-idempotency-contract.yml config --quiet

      - name: Build idempotency contract image
        working-directory: marty-credentials
        run: |
          mkdir -p tests/artifacts/issuance-idempotency
          chmod 0777 tests/artifacts/issuance-idempotency
          docker compose --file docker-compose.issuance-idempotency-contract.yml build --pull idempotency-contract

      - name: Race identical issuance reservations in PostgreSQL
        working-directory: marty-credentials
        run: >-
          docker compose --file docker-compose.issuance-idempotency-contract.yml
          up --force-recreate --abort-on-container-exit
          --exit-code-from idempotency-contract idempotency-contract

      - name: Require sanitized idempotency evidence
        working-directory: marty-credentials
        run: |
          test "$(jq -r '.status' tests/artifacts/issuance-idempotency/contract-result.json)" = passed
          test "$(jq -r '.migration_revision' tests/artifacts/issuance-idempotency/contract-result.json)" = merge_issuance_heads
          test "$(jq -r '.created_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.recovered_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.same_transaction' tests/artifacts/issuance-idempotency/contract-result.json)" = true
          test "$(jq -r '.same_pre_authorized_code' tests/artifacts/issuance-idempotency/contract-result.json)" = true
          test "$(jq -r '.raw_key_persisted' tests/artifacts/issuance-idempotency/contract-result.json)" = false
          test "$(jq -r '.production_repository_exercised' tests/artifacts/issuance-idempotency/contract-result.json)" = true
          test "$(jq -r '.changed_semantics_rejected' tests/artifacts/issuance-idempotency/contract-result.json)" = true
          test "$(jq -r '.early_recovery_exercised' tests/artifacts/issuance-idempotency/contract-result.json)" = true
          test "$(jq -r '.delivered_finalization_winner_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.issued_credential_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.issued_transaction_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.grpc_signing_claim_winner_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.grpc_issued_credential_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.grpc_issued_transaction_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.grpc_failed_reserved_transaction_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 1
          test "$(jq -r '.grpc_failed_issued_credential_count' tests/artifacts/issuance-idempotency/contract-result.json)" = 0
          test "$(jq -r '.source_revision' tests/artifacts/issuance-idempotency/contract-result.json)" = "$ISSUANCE_IDEMPOTENCY_SOURCE_REVISION"

      - name: Upload issuance idempotency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: issuance-idempotency-${{ github.run_id }}-${{ github.run_attempt }}
          path: marty-credentials/tests/artifacts/issuance-idempotency/contract-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable idempotency stack
        if: always()
        working-directory: marty-credentials
        run: docker compose --file docker-compose.issuance-idempotency-contract.yml down --volumes --remove-orphans

  build-core-python-wheels:
    name: Core Python Wheels
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'merge_group' || github.actor == 'dependabot[bot]') && 'READ_ONLY' || 'READ_WRITE' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - name: Restore exact pinned Core wheels
        id: core-wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core-wheels
          key: core-python-wheels-v2-${{ runner.os }}-${{ runner.arch }}-py311-rust1971-maturin1141-${{ env.MARTY_CORE_REVISION }}

      - if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ElevenID/marty-core
          ref: ${{ env.MARTY_CORE_REVISION }}
          path: marty-core

      - if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1

      - name: Enable compiler cache
        if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Cache Core build
        if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-core-python-inputs-${{ env.MARTY_CORE_REVISION }}

      - name: Build exact pinned Core wheels
        if: ${{ steps.core-wheel-cache.outputs.cache-hit != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.14.1
          maturin build --release --compatibility off --manifest-path marty-core/marty-bindings/Cargo.toml --features pyo3/extension-module --out core-wheels
          maturin build --release --compatibility off --manifest-path marty-core/marty-verification/Cargo.toml --features pyo3/extension-module,python,csca,eudi --out core-wheels

      - name: Require both native distributions
        shell: bash
        run: |
          set -euo pipefail
          test "$(find core-wheels -maxdepth 1 -name 'marty_rs-*.whl' | wc -l)" -eq 1
          test "$(find core-wheels -maxdepth 1 -name 'marty_verification_py-*.whl' | wc -l)" -eq 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-python-${{ runner.os }}
          path: core-wheels/*.whl
          if-no-files-found: error
          retention-days: 2

  test-python:
    name: Python Tests
    needs: build-core-python-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: core-python-${{ runner.os }}
          path: marty-credentials/release-deps

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: marty-credentials/pyproject.toml
      - name: Run Python 3.11 quality suite
        working-directory: marty-credentials
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/marty-credentials/services
        run: bash scripts/run-python-ci.sh
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: marty-credentials/pyproject.toml
      - name: Run Python 3.12 quality suite
        working-directory: marty-credentials
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/marty-credentials/services
        run: bash scripts/run-python-ci.sh

  oid4vci-capability-postgres:
    name: OID4VCI Capability PostgreSQL Race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OID4VCI_CAPABILITY_TEST_DATABASE_URL: postgresql+asyncpg://marty:marty_test@localhost:5432/marty_oid4vci_test
    services:
      postgres:
        image: postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: marty
          POSTGRES_PASSWORD: marty_test
          POSTGRES_DB: marty_oid4vci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marty -d marty_oid4vci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install service test dependencies
        working-directory: marty-credentials
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] "psycopg[binary]==3.2.3"

      - name: Exercise shared atomic PAR and proof-nonce consumption
        working-directory: marty-credentials
        run: pytest tests/test_oid4vci_ephemeral_capabilities_postgres.py -v

  test-wasm:
    name: WASM Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marty-credentials/rust/marty-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: marty-credentials

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM (web target)
        run: wasm-pack build --locked --target web --no-default-features --features wasm

      - name: Build WASM (nodejs target)
        run: wasm-pack build --locked --target nodejs --no-default-features --features wasm

      - name: Build WASM (bundler target)
        run: wasm-pack build --locked --target bundler --no-default-features --features wasm

      - name: Test WASM
        run: wasm-pack test --node --no-default-features --features wasm

  ci-gate:
    name: CI Gate
    if: always()
    needs: [preflight, test-rust, test-local-python-binding, security, python-security, canvas-portable-migration, canvas-worker-consumer-ranges, issuance-idempotency-contract, build-core-python-wheels, test-python, oid4vci-capability-postgres, test-wasm]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Require every CI lane
        shell: bash
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
      - name: Summarize CI performance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: context.runId});
            const {data} = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId, filter: 'latest', per_page: 100,
            });
            const created = new Date(run.created_at);
            const rows = data.jobs.filter(job => job.started_at && job.completed_at).map(job => ({
              name: job.name,
              queue: Math.max(0, Math.round((new Date(job.started_at) - created) / 1000)),
              run: Math.max(0, Math.round((new Date(job.completed_at) - new Date(job.started_at)) / 1000)),
            })).sort((a, b) => b.run - a.run);
            const maxQueue = Math.max(0, ...rows.map(row => row.queue));
            core.summary.addHeading('CI performance').addTable([
              [{data: 'Longest jobs', header: true}, {data: 'Queue', header: true}, {data: 'Runtime', header: true}],
              ...rows.slice(0, 10).map(row => [row.name, `${row.queue}s`, `${row.run}s`]),
            ]).addRaw(`Longest observed queue delay: ${maxQueue}s.`);
            if (maxQueue > 300) core.warning(`Runner queue delay reached ${maxQueue}s.`);
            await core.summary.write();
