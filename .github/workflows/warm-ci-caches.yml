name: Warm CI Caches

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - pyproject.toml
      - '**/Cargo.toml'
      - '**/*.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-ci-caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Warm Rust cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_WRITE
    defaults:
      run:
        working-directory: rust/marty-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Cache Cargo inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-rust-stable-inputs-${{ hashFiles('Cargo.lock') }}
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Compile native test targets
        run: cargo test --locked --no-default-features --features native --no-run
      - name: Warm clippy cache
        run: cargo clippy --locked --no-default-features --features native -- -D warnings
      - name: Report compiler cache effectiveness
        if: always()
        run: sccache --show-stats

  python:
    name: Warm Python cache (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Populate the dependency download cache
        shell: bash
        run: |
          python -m pip download --disable-pip-version-check \
            --dest "$RUNNER_TEMP/marty-credentials-wheelhouse" \
            '.[dev]' pytest pytest-asyncio
