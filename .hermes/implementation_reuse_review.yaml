status: complete
search_scope:
  - current DIDComm sign-and-deliver orchestration and status-list allocation order
  - existing exhaustive issuer encryption policy loader and Rust DIDComm bindings
  - holder DID resolution, endpoint validation, and owned boundary tests
  - revocation-profile status allocation API and available rollback or idempotency contracts
search_queries:
  - _didcomm_sign_and_deliver allocation signing holder resolution encryption
  - didcomm_encrypt_delivery authcrypt sender private public key binding
  - allocate-index deallocate release rollback idempotency
  - prepared DIDComm delivery encryption context
candidate_implementations:
  - path: services/issuance/application/rust_integration.py
    disposition: extend existing policy loader and canonical Rust encryption delegation
  - path: services/issuance/infrastructure/api/routes.py
    disposition: reorder existing product-owned orchestration before irreversible allocation
  - path: services/issuance/infrastructure/api/routes.py#_allocate_credential_status_list_entries
    disposition: no rollback or idempotency contract exists; retain as a documented residual
no_match_statement: ""
decision: reuse_existing
canonical_implementation:
  path: services/issuance/application/rust_integration.py
  language: Python delegation to released Rust binding
rust_disposition: reuse_existing_rust_owner
non_rust_rationale: >-
  Python owns transaction orchestration and freezes one attempt-scoped delivery
  context, while recipient key compatibility and authcrypt private/public binding
  are validated by the existing canonical Rust encryption implementation. No
  cryptographic algorithm, DID resolver, or policy parser is duplicated.
non_rust_exception_approval: ""
intentional_duplicate_exception:
  rationale: ""
  divergence_owner: ""
  synchronization_or_compatibility_strategy: ""
  retirement_or_convergence_plan: ""
  architecture_decision_ref: ""
  human_approval: ""
