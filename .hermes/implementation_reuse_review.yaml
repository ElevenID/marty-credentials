status: complete
search_scope:
  - current Marty Core source revisions in Cargo manifests and lockfiles
  - production wheel pins and digests in the release dependency manifest
  - CI and cache workflow revisions used to build native Core bindings
  - existing local did:web resolver or port-normalization implementations
search_queries:
  - marty-core revision Cargo.toml Cargo.lock
  - MARTY_CORE_REVISION ci warm cache
  - release dependencies marty-rs marty-verification sha256
  - did:web percent encoded port resolver
candidate_implementations:
  - path: Cargo.toml
    disposition: reuse the audited upstream Marty Core implementation by exact commit
  - path: release/dependencies.json
    disposition: reuse immutable upstream release wheels by exact asset digest
  - path: .github/workflows/ci.yml
    disposition: keep native test builds pinned to the same audited upstream commit
no_match_statement: ""
decision: reuse_existing
canonical_implementation:
  path: Cargo.toml
  language: Rust workspace dependency delegation
rust_disposition: reuse_existing_rust_owner
non_rust_rationale: >-
  This change introduces no local algorithm or resolver. Credentials consumes
  the audited Marty Core release by exact source commit and immutable wheel
  digests, while CI and cache workflows build from that same commit.
non_rust_exception_approval: ""
intentional_duplicate_exception:
  rationale: ""
  divergence_owner: ""
  synchronization_or_compatibility_strategy: ""
  retirement_or_convergence_plan: ""
  architecture_decision_ref: ""
  human_approval: ""
