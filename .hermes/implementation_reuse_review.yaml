status: complete
search_scope:
  - current Marty Core source revisions in Cargo manifests and lockfiles
  - production wheel pins and digests in the release dependency manifest
  - CI and cache workflow revisions used to build native Core bindings
  - current Credentials issuance and verification feature requirements
search_queries:
  - marty-core revision Cargo.toml Cargo.lock
  - MARTY_CORE_REVISION ci warm cache
  - release dependencies marty-rs marty-verification sha256
  - sod-builder cert-builder CscaAuthority marty_verification imports
candidate_implementations:
  - path: Cargo.toml
    disposition: reuse the audited upstream Marty Core implementation by exact commit
  - path: release/dependencies.json
    disposition: reuse immutable upstream release wheels by exact asset digest
  - path: .github/workflows/ci.yml
    disposition: keep native test builds pinned to the same audited upstream commit and released verifier feature profile
  - path: rust/marty-rs/src/emrtd/issuance.rs
    disposition: retain the explicit issuance-only certificate and SOD builder requirement
no_match_statement: ""
decision: reuse_existing
canonical_implementation:
  path: Cargo.toml
  language: Rust workspace dependency delegation
rust_disposition: reuse_existing_rust_owner
non_rust_rationale: >-
  This change introduces no local verification or authority algorithm.
  Credentials consumes the audited Core release by exact source commit and
  immutable wheel digests. The released verifier wheel remains free of
  authority-only builders; Credentials retains its explicit Rust issuance
  builder feature only where eMRTD issuance actually constructs CSCA/DSC/SOD.
non_rust_exception_approval: ""
intentional_duplicate_exception:
  rationale: ""
  divergence_owner: ""
  synchronization_or_compatibility_strategy: ""
  retirement_or_convergence_plan: ""
  architecture_decision_ref: ""
  human_approval: ""
