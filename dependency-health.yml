version: 1
dependencies:
  - package: ssi subcrates
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/ssi
    current: ssi-claims-0.7/ssi-jwk-0.4
    target: upstream-ssi-jwt-release-without-serde-with-2
    status: temporary-exception
    decision: replace
    advisories: [GHSA-7gcf-g7xr-8hxj, RUSTSEC-2021-0127]
    tracking-issue: https://github.com/ElevenID/marty-credentials/issues/17
    review-after: 2026-11-20
    rationale: >-
      Re-reviewed 2026-11-06 against Cargo.lock and the current upstream manifest at
      https://github.com/spruceid/ssi/blob/886a6cf694dfdb6b019d5f69a04dd16f01cb58a4/crates/claims/crates/jwt/Cargo.toml.
      Upstream still declares serde_with 2.3.2 and https://github.com/spruceid/ssi/pull/706
      remains closed unmerged. Retain exact ElevenID revision 234723638447c30f90cf499bce1d6b092f865e9d,
      which removes that unused dependency. GHSA-7gcf-g7xr-8hxj is fixed in serde_with 3.21.0;
      this lock contains only 3.22.0, directly required by Cedar rather than SSI.
      See https://github.com/advisories/GHSA-7gcf-g7xr-8hxj.
      The separate https://rustsec.org/advisories/RUSTSEC-2021-0127.html exception
      remains applicable to serde_cbor 0.11.2 through ssi-data-integrity-suites 0.4.0.
      Keep replacement tracked in issue 17 and the existing advisory exception;
      narrow SSI crates remain required by supported credential verification.
  - package: linked-data
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/ssi
    current: "ElevenID/ssi-elevenid@6f86efc1579033e14ff2ad7d115ca0857e16a67f"
    target: current-upstream-without-unsound-containers
    status: maintained
    decision: fork
    advisories: [RUSTSEC-2023-0126, RUSTSEC-2026-0255]
    tracking-issue: https://github.com/ElevenID/marty-credentials/issues/17
    review-after: 2026-11-04
    rationale: Re-reviewed 2026-10-07. The exact reviewed ElevenID revision removes linked-data's im dependency, eliminating the unsound and unmaintained im/sized-chunks chain implicated in safe-code aliasing and double-free/use-after-free advisories. The patch applies to production Python and WASM graphs and remains exact-revision pinned for reproducibility.
  - package: isomdl
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/isomdl
    current: "ElevenID/isomdl-elevenid@671044c9495aec101bf0cd381669d5ed6f64dd11"
    target: current-upstream-plus-reviewed-elevenid-patches
    status: maintained
    decision: fork
    advisories: [GHSA-9c48-w39g-hm26, GHSA-4grx-2x9w-596c, GHSA-c38w-74pg-36hr, RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-credentials/issues/17
    review-after: 2026-10-28
    rationale: mdoc issuance and verification remain supported. The exact-revision ElevenID fork removes ssi-jwk 0.2.1 and rsa 0.6.1, accepts standards-valid empty issuerSigned nameSpaces without weakening non-empty validation, and verifies DeviceAuthentication against the exact verifier-owned CBOR session transcript bytes. The reviewed revision provides a serial-first digest executor boundary, behavior-locked mdoc issuance planning, caller-ordered cross-credential preparation, an optional bounded native executor, and optional safe SHA-256 SIMD lanes. Marty keeps both parallel and SIMD features inactive, so the scalar route remains selected. It preserves SpruceID history and licensing and keeps synchronization changes reviewable inside the ElevenID fork; no upstream pull request is implied. Equivalent upstream behavior may replace a downstream patch only after the full mdoc interoperability and security suites pass.
  - package: sd-jwt-rs
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/openwallet-foundation-labs/sd-jwt-rust
    current: "0.7.1@2799b5fff011342aefe8ac5e9653d5b084e2a20c"
    target: current-upstream-plus-reviewed-elevenid-patches
    status: maintained
    decision: fork
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-credentials/issues/17
    review-after: 2026-10-30
    rationale: The immutable ElevenID revision carries the RFC 9901 holder API update plus reviewed serial-first issuance and verifier refactors, consumer-compatible WASM binding resolution, and dependency-supported Rust 1.88 metadata. Marty leaves optional parallel and benchmark surfaces inactive. The source-breaking holder constructor is adopted through its explicit unverified variant to preserve the Python presentation builder's existing caller-preverified contract because that API does not receive a trusted issuer-key resolver; adding issuer authentication is a separate behavior change rather than a hidden dependency-bump side effect.
  - package: pyo3
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/PyO3/pyo3
    current: "0.29.2"
    target: coordinated-Core-PyO3-0.30.x-migration
    status: maintained
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-credentials/issues/17
    review-after: 2026-11-03
    rationale: Re-reviewed 2026-10-20. Cargo.lock and cargo tree resolve one PyO3 0.29.2 shared by this extension and the pinned Core marty-python-adapters. Upstream https://github.com/PyO3/pyo3/releases/tag/v0.30.1 is available; its 0.30 API migration must be coordinated with that canonical adapter rather than independently changing this thin binding. Retain the compatible 0.29 family while current native wheel and local-binding CI qualify it; no security exception is added.
  - package: rsa
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto/RSA
    current: "0.9.10"
    target: coordinated-Core-RSA-0.10.0-migration
    status: watch
    decision: retain
    advisories: [RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/361
    review-after: 2026-11-21
    rationale: >-
      Re-reviewed 2026-11-14 against Cargo.lock, resolved native/Python/WASM metadata,
      https://github.com/rust-lang/crates.io-index/blob/master/3/r/rsa and
      https://rustsec.org/advisories/RUSTSEC-2023-0071.html.
      Stable rsa 0.10.0 was published on 2026-11-08 and is not yanked; RustSec now
      declares versions >=0.10.0 patched. The locked 0.9.10 remains affected.
      Its only direct reverse dependencies are marty-crypto and marty-verification
      at Core revision b30866a81284d97b65a3e4cdd85e917df17e10d4, both requiring ^0.9.
      Reviewed Core RSA, ISO 9796 and DG15 call sites use public verification and
      public-key codecs; all three resolved graphs pass the existing KMS-only guard.
      The upstream 0.10 release uses crypto-bigint and requires
      signature 3, digest/sha2 0.11, pkcs8 0.11 and spki 0.8, unlike the pinned
      Core graph. A Credentials-only lock update cannot satisfy those ^0.9 requirements
      or remove the affected copy. Upgrade through the coordinated Core migration
      in issue 361, then qualify RSA, certificate, JOSE, passport, mdoc, Python and
      WASM behavior before propagating its exact revision. Retain the explicit
      advisory watch and existing exception for this seven-day migration checkpoint;
      https://github.com/ElevenID/marty-credentials/issues/17 retains consumer acceptance.
      The advisory remains unresolved in this graph, and remote key custody remains required.
